<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
    <div class="parent">
        <h1>❤️ Love Calculator ❤️</h1>
        <p class="subtitle">Find Your Compatibility ❤️</p>
        <form >
            <label for="Boy">👦 Your Name</label>
            <input type="text" id="Boy" name="Boy" required>
            
            <label for="Girl">👧 Partner Name</label>
            <input type="text" id="Girl" name="Girl" required> 
           
            <button type="submit">❤️ Calculate Love ❤️</button>
        </form>
        <h3 id="couple"></h3>
       <h2 id="score">❤️ Love Score: --%</h2>
       <p id="message"></p>

       <div class="progress-container">

    <div class="progress-bar"></div>

</div>
    <p class="footer">
Made with ❤️ by Moni Kaur
    </div>
    <script src="script.js"></script>

</p>
</body>
</html>
